<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cosmos-go (Go port)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  #cosmos { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="cosmos"></div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("compare.wasm"), go.importObject)
    .then(result => go.run(result.instance));
</script>
</body>
</html>
